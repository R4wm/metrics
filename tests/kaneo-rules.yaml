rule_files:
- ../central/vmalert/kaneo.yaml
evaluation_interval: 30s
tests:
- name: successful backup
  interval: 1m
  input_series:
  - series: kaneo_backup_last_attempt_success{host="10.0.0.68"}
    values: 1+0x10
  - series: kaneo_backup_last_success_timestamp_seconds{host="10.0.0.68"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: KaneoBackupFailed
    exp_alerts: []
- name: failed backup
  interval: 1m
  input_series:
  - series: kaneo_backup_last_attempt_success{host="10.0.0.68"}
    values: 0+0x10
  - series: kaneo_backup_last_success_timestamp_seconds{host="10.0.0.68"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: KaneoBackupFailed
    exp_alerts:
    - exp_labels:
        severity: critical
        service: kaneo
        host: 10.0.0.68
      exp_annotations:
        summary: Latest Kaneo backup failed
- name: fresh backup
  interval: 1m
  input_series:
  - series: kaneo_backup_last_success_timestamp_seconds{host="10.0.0.68"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: KaneoBackupStale
    exp_alerts: []
- name: stale backup
  interval: 1m
  input_series:
  - series: kaneo_backup_last_success_timestamp_seconds{host="10.0.0.68"}
    values: -100000+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: KaneoBackupStale
    exp_alerts:
    - exp_labels:
        severity: critical
        service: kaneo
        host: 10.0.0.68
      exp_annotations:
        summary: Kaneo has no successful backup within 26 hours
- name: missing backup
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 3m
    alertname: KaneoBackupStale
    exp_alerts:
    - exp_labels:
        severity: critical
        service: kaneo
        host: 10.0.0.68
      exp_annotations:
        summary: Kaneo has no successful backup within 26 hours
- name: 26 hour boundary
  interval: 1m
  input_series:
  - series: kaneo_backup_last_success_timestamp_seconds{host="10.0.0.68"}
    values: 0+0x1560
  alert_rule_test:
  - eval_time: 26h
    alertname: KaneoBackupStale
    exp_alerts: []
- name: past 26 hour boundary
  interval: 1m
  input_series:
  - series: kaneo_backup_last_success_timestamp_seconds{host="10.0.0.68"}
    values: 0+0x1564
  alert_rule_test:
  - eval_time: 26h3m
    alertname: KaneoBackupStale
    exp_alerts:
    - exp_labels:
        severity: critical
        service: kaneo
        host: 10.0.0.68
      exp_annotations:
        summary: Kaneo has no successful backup within 26 hours
- name: maintenance result 0
  interval: 1m
  input_series:
  - series: kaneo_backup_maintenance_success{host="10.0.0.68"}
    values: 0+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: KaneoBackupMaintenanceFailed
    exp_alerts:
    - exp_labels:
        severity: warning
        service: kaneo
        host: 10.0.0.68
      exp_annotations:
        summary: Kaneo repository integrity or retention check failed
- name: maintenance result 1
  interval: 1m
  input_series:
  - series: kaneo_backup_maintenance_success{host="10.0.0.68"}
    values: 1+0x10
  alert_rule_test:
  - eval_time: 3m
    alertname: KaneoBackupMaintenanceFailed
    exp_alerts: []
- name: expected backup downtime does not page
  interval: 1m
  input_series:
  - series: kaneo_application_up{host="10.0.0.68"}
    values: 0+0x6
  alert_rule_test:
  - eval_time: 6m
    alertname: KaneoUnavailable
    exp_alerts: []
- name: sustained application outage
  interval: 1m
  input_series:
  - series: kaneo_application_up{host="10.0.0.68"}
    values: 0+0x15
  alert_rule_test:
  - eval_time: 11m
    alertname: KaneoUnavailable
    exp_alerts:
    - exp_labels:
        severity: critical
        service: kaneo
        host: 10.0.0.68
      exp_annotations:
        summary: Kaneo is unavailable beyond its expected backup window
- name: healthy application
  interval: 1m
  input_series:
  - series: kaneo_application_up{host="10.0.0.68"}
    values: 1+0x15
  alert_rule_test:
  - eval_time: 11m
    alertname: KaneoUnavailable
    exp_alerts: []
