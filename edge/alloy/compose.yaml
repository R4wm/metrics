services:
  alloy:
    image: grafana/alloy:v1.18.0
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=127.0.0.1:12345"]
    environment:
      METRICS_REMOTE_WRITE_URL: ${METRICS_REMOTE_WRITE_URL:?set this in .env}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    restart: unless-stopped
