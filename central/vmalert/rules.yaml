groups:
  - name: platform
    interval: 30s
    rules:
      - alert: HostDiskSpaceLow
        expr: min by (host) (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Host disk space is below 15%
      - alert: MetricsTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Metrics target {{ $labels.job }} is down
      - alert: ContainerRestartChurn
        expr: changes(container_start_time_seconds{container!=""}[15m]) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Container {{ $labels.name }} restarted repeatedly
      - alert: BibleAPIHighErrorRate
        expr: sum(rate(bible_api_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(bible_api_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Bible API 5xx rate is above 5%
      - alert: BibleAPIHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(bible_api_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Bible API p95 latency is above one second
